apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: database-postgres-ovh
spec:
  compositeTypeRef:
    apiVersion: selfservice.ovh/v1alpha1
    kind: DatabaseStack
  mode: Pipeline
  pipeline:
    - step: environment-configs
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: ovh-project-config

    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: databaseinstance
            base:
              apiVersion: databases.ovh.edixos.io/v1alpha1
              kind: ProjectDatabase
              spec:
                forProvider:
                  engine: postgresql
                  version: "16"
                  plan: discovery
                  flavor: b3-8
                  diskSize: 160
                  nodes:
                    - region: GRA
                providerConfigRef:
                  name: default
            patches:
              - type: FromEnvironmentFieldPath
                fromFieldPath: serviceName
                toFieldPath: spec.forProvider.serviceName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.engine
                toFieldPath: spec.forProvider.engine
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.version
                toFieldPath: spec.forProvider.version
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.plan
                toFieldPath: spec.forProvider.plan
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.flavor
                toFieldPath: spec.forProvider.flavor
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.description
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "Managed by Crossplane — claim %s"

          - name: databaseuser
            base:
              apiVersion: databases.ovh.edixos.io/v1alpha1
              kind: ProjectDatabasePostgresqlUser
              spec:
                forProvider:
                  name: app
                  clusterIdSelector:
                    matchControllerRef: true
                providerConfigRef:
                  name: default
                writeConnectionSecretToRef:
                  namespace: crossplane-system
            patches:
              - type: FromEnvironmentFieldPath
                fromFieldPath: serviceName
                toFieldPath: spec.forProvider.serviceName
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-user-conn"

          - name: bucket
            base:
              apiVersion: cloud.ovh.edixos.io/v1alpha1
              kind: ProjectStorage
              spec:
                forProvider:
                  regionName: GRA
                providerConfigRef:
                  name: default
            patches:
              - type: FromEnvironmentFieldPath
                fromFieldPath: serviceName
                toFieldPath: spec.forProvider.serviceName
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-backups"

