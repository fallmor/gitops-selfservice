apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: aiobservabilities.selfservice.ovh
spec:
  group: selfservice.ovh
  names:
    kind: AIObservability
    plural: aiobservabilities
  claimNames:
    kind: AIObservability
    plural: aiobservabilities
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    workloadDescription:
                      type: string
                      description: >
                        Describe what needs to be observed, in plain English.
                        Example: "customer-facing API, need to debug slow
                        requests across services, on-call needs alerting"
                  required:
                    - workloadDescription
              required:
                - parameters
