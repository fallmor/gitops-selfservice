# XRD — AI-assisted Database
# Extends the base Database XRD with a workloadDescription field.
# Developers describe their use case in plain English; the Claude function
# translates that description into concrete infrastructure parameters.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: aidatabases.selfservice.ovh
spec:
  group: selfservice.ovh
  names:
    kind: AIDatabase
    plural: aidatabases
  claimNames:
    kind: AIDatabase
    plural: aidatabases
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    # Developer-facing: plain English, no cloud knowledge needed
                    workloadDescription:
                      type: string
                      description: >
                        Describe your workload in plain English.
                        Example: "e-commerce app, ~500 concurrent users,
                        heavy reads, stores product catalog and orders"
                    engine:
                      type: string
                      default: postgres
                      enum:
                        - postgres
                        - mysql
                    version:
                      type: string
                      default: "16"
                    # These are set by the Claude function — devs can omit them
                    storageGB:
                      type: integer
                      default: 20
                    plan:
                      type: string
                      default: discovery
                      enum:
                        - discovery
                        - production
                    flavorName:
                      type: string
                      default: b3-8
                      enum:
                        - b3-8
                        - b3-16
                  required:
                    - workloadDescription
                    - engine
              required:
                - parameters
