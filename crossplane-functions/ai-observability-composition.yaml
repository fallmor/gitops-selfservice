apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: aiobservability-helm
  labels:
    provider: kubernetes
    ai: claude
spec:
  compositeTypeRef:
    apiVersion: selfservice.ovh/v1alpha1
    kind: AIObservability
  mode: Pipeline
  pipeline:
    - step: ai-generate-resources
      functionRef:
        name: function-claude
      credentials:
        - name: claude
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: claude
      input:
        apiVersion: claude.fn.upbound.io/v1alpha1
        kind: Prompt
        modelName: claude-sonnet-4-6
        systemPrompt: |
          Platform engineer picking an observability stack for a workload description.

          Output ONLY a YAML stream of kubernetes.crossplane.io/v1alpha2 Object
          manifests, `---`-separated, no prose, no code fences. Each needs
          metadata.annotations["upbound.io/name"] set to exactly one of: "metrics",
          "logs", "alert" — stable across reconciles. Prefix resource names inside
          each manifest with `.metadata.name` from the composite JSON, e.g.
          "<name>-metrics".

          Always include "metrics". Add "logs" only if the workload needs
          cross-service/cross-instance log correlation (most don't). Add "alert"
          only if a failure of this workload matters to someone (skip for
          throwaway/dev work).

          For "alert": this cluster has no instrumented app, only kube-state-metrics
          and node-exporter (installed by "metrics"). Pick the ONE failure mode that
          matters most for this workload (crash-looping, OOMKill, disk pressure,
          node down...) and write a real PromQL `expr` against those metrics, plus a
          threshold and `for:` you judge sane. No placeholder expressions.

          Template "metrics" (always):
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            annotations:
              upbound.io/name: metrics
          spec:
            forProvider:
              manifest:
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: PLACEHOLDER-metrics
                  namespace: crossplane-system
                spec:
                  interval: 5m
                  targetNamespace: observability
                  install:
                    createNamespace: true
                  chart:
                    spec:
                      chart: kube-prometheus-stack
                      sourceRef:
                        kind: HelmRepository
                        name: prometheus-community
                        namespace: crossplane-system
                  # required so "alert"'s PrometheusRule gets picked up regardless
                  # of namespace/labels — the chart otherwise only watches rules
                  # labeled release=<helm-release-name>, which the LLM can't predict.
                  values:
                    prometheus:
                      prometheusSpec:
                        ruleSelectorNilUsesHelmValues: false
                        ruleSelector: {}
                        ruleNamespaceSelector: {}
            providerConfigRef:
              name: kubernetes-incluster

          Template "logs" (only if warranted). Keep `values.loki.isDefault: false`
          exactly as shown — loki-stack defaults its datasource to isDefault: true,
          which collides with kube-prometheus-stack's Prometheus datasource and
          crashes Grafana when both are installed:
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            annotations:
              upbound.io/name: logs
          spec:
            forProvider:
              manifest:
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: PLACEHOLDER-logs
                  namespace: crossplane-system
                spec:
                  interval: 5m
                  targetNamespace: observability
                  install:
                    createNamespace: true
                  chart:
                    spec:
                      chart: loki-stack
                      sourceRef:
                        kind: HelmRepository
                        name: grafana
                        namespace: crossplane-system
                  values:
                    loki:
                      isDefault: false
            providerConfigRef:
              name: kubernetes-incluster

          Template "alert" (only if warranted — fill expr/for/summary for real):
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            annotations:
              upbound.io/name: alert
          spec:
            forProvider:
              manifest:
                apiVersion: monitoring.coreos.com/v1
                kind: PrometheusRule
                metadata:
                  name: PLACEHOLDER-alert
                  namespace: observability
                spec:
                  groups:
                    - name: PLACEHOLDER-alert
                      rules:
                        - alert: PLACEHOLDER
                          expr: PLACEHOLDER
                          for: 5m
                          labels:
                            severity: warning
                          annotations:
                            summary: PLACEHOLDER
            providerConfigRef:
              name: kubernetes-incluster
        userPrompt: |
          Composite resource: {{ .Composite }}
          Extract workloadDescription and metadata.name, decide the observability
          stack for this workload.

    - step: auto-ready
      functionRef:
        name: function-auto-ready
