apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: aidatabase-postgres-ovh
  labels:
    provider: ovh
    engine: postgresql
    ai: claude
spec:
  compositeTypeRef:
    apiVersion: selfservice.ovh/v1alpha1
    kind: AIDatabase
  mode: Pipeline
  pipeline:
    - step: ai-generate-resources
      functionRef:
        name: function-claude
      credentials:
        - name: claude
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: claude
      input:
        apiVersion: claude.fn.upbound.io/v1alpha1
        kind: Prompt
        modelName: claude-sonnet-4-6
        systemPrompt: |
          You are a Crossplane resource generator for OVHcloud databases.
          Based on the workload description, generate ONE ProjectDatabase Kubernetes resource.

          CRITICAL: Return ONLY valid YAML. No explanation, no markdown, no code fences, no backticks.
          The resource MUST have metadata.annotations with upbound.io/name set to databaseinstance.

          Size selection rules:
          - production workloads (high traffic, HA, Ramadan/peak season): plan=production, flavor=b3-16, diskSize=200
          - dev/staging (low traffic, non-critical): plan=discovery, flavor=b3-8, diskSize=160

          Return exactly this structure with your chosen values for plan, flavor, diskSize:
          apiVersion: databases.ovh.edixos.io/v1alpha1
          kind: ProjectDatabase
          metadata:
            annotations:
              upbound.io/name: databaseinstance
          spec:
            forProvider:
              engine: postgresql
              version: "16"
              plan: CHOOSE_discovery_or_production
              flavor: CHOOSE_b3-8_or_b3-16
              diskSize: CHOOSE_160_or_200
              serviceName: "4835abd389014831a84994db5635fc1a"
              nodes:
                - region: GRA
            providerConfigRef:
              name: default
        userPrompt: |
          Here is the composite resource as JSON: {{ .Composite }}
          Extract workloadDescription from spec.parameters and generate the appropriate OVHcloud database resource.

    - step: auto-ready
      functionRef:
        name: function-auto-ready
