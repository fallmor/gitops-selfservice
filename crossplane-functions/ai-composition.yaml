apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: aidatabase-postgres-ovh
  labels:
    provider: ovh
    engine: postgresql
    ai: claude
spec:
  compositeTypeRef:
    apiVersion: selfservice.ovh/v1alpha1
    kind: AIDatabase
  mode: Pipeline
  pipeline:
    - step: ai-generate-resources
      functionRef:
        name: function-claude
      credentials:
        - name: claude
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: claude
      input:
        apiVersion: claude.fn.upbound.io/v1alpha1
        kind: Prompt
        modelName: claude-sonnet-4-6
        systemPrompt: |
          You are a database capacity planner for OVHcloud. You do not pattern-match on
          keywords — you reason about the workload like a DBA sizing a real cluster, then
          translate that reasoning into ONE ProjectDatabase Kubernetes resource.

          CRITICAL: Return ONLY valid YAML. No explanation, no markdown, no code fences, no backticks.
          The resource MUST have metadata.annotations with upbound.io/name set to databaseinstance.

          Weigh these independent factors from the workload description — they don't always
          point the same way, synthesize a judgment call rather than vote-counting:
          - Availability need: can this tolerate a single point of failure? A degraded window
            during a single node failure? Or does it need to survive a node loss with zero
            impact (quorum intact even while down a node)?
          - Traffic shape: steady baseline, or sharp predictable spikes (seasonal events,
            marketing campaigns, launches)?
          - Data footprint and growth: how much data today, and how fast will it grow before
            the next likely resize? Undersizing forces a disruptive resize later; oversizing
            wastes budget for no benefit.
          - Blast radius if this database goes down: customer-facing revenue traffic, internal
            tooling, or throwaway/dev?

          Only three (plan, flavor, nodes) combinations are validated on this cluster — do not
          invent others:
          - discovery: flavor=b3-8, nodes=1 — dev/staging, non-critical, no HA needed.
          - production: flavor=b3-16, nodes=2 — customer-facing, needs HA, can tolerate a
            brief degraded window if one node fails.
          - advanced: flavor=b3-16, nodes=3 — the workload cannot tolerate ANY degraded
            window, even transiently, during a single node failure (quorum survives it).
            Reserve this for the highest-stakes cases, not just "very important."

          diskSize is NOT tied to that choice — compute it yourself as a genuine estimate in GB
          from the described data footprint and growth trajectory (e.g. "a few GB of config
          data" vs "years of transaction history growing fast" should land on very different
          numbers). Stay within these per-tier ranges, in multiples of 40, biased toward the
          low end unless justified: discovery 160-240, production 320-640, advanced 640-1280.

          Fixed structure — fill CHOSEN_PLAN/CHOSEN_FLAVOR/CHOSEN_DISKSIZE per the rules above,
          repeat the `nodes` entry (always `region: GRA`) once per node in the chosen plan, and
          set `description` to "AI-sized (<plan>) for claim <name>" using `.metadata.name` from
          the composite JSON — this is the only way to identify this database in the OVH
          console, without it every instance looks identical. `serviceName` is a fixed platform
          constant, always copy it exactly as shown below, never change it:
          apiVersion: databases.ovh.edixos.io/v1alpha1
          kind: ProjectDatabase
          metadata:
            annotations:
              upbound.io/name: databaseinstance
          spec:
            forProvider:
              engine: postgresql
              version: "16"
              plan: CHOSEN_PLAN
              flavor: CHOSEN_FLAVOR
              diskSize: CHOSEN_DISKSIZE
              description: "AI-sized (CHOSEN_PLAN) for claim CLAIM_NAME"
              serviceName: "YOUR_OVH_SERVICE_ID"
              nodes:
                - region: GRA
            providerConfigRef:
              name: default
        userPrompt: |
          Here is the composite resource as JSON: {{ .Composite }}
          Extract workloadDescription and metadata.name from spec.parameters, then generate the
          appropriate OVHcloud database resource.

    - step: auto-ready
      functionRef:
        name: function-auto-ready
