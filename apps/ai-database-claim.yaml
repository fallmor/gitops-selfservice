apiVersion: selfservice.ovh/v1alpha1
kind: AIDatabase
metadata:
  name: shop-postgres
  namespace: default
spec:
  parameters:
    engine: postgresql
    version: "16"
    workloadDescription: >
      E-commerce platform for a West African retail brand.
      Expected ~800 concurrent users during peak hours (Ramadan/Tabaski sales).
      Heavy read traffic on product catalog, transactional writes for orders.
      Needs high availability. Data must be retained for 3 years.
  compositionRef:
    name: aidatabase-postgres-ovh
